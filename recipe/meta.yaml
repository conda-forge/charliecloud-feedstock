{% set version = "0.44" %}

package:
  name: charliecloud
  version: {{ version }}

source:
  # Upstream moved from GitHub to GitLab in Oct 2024; releases since v0.40 are
  # cut only on GitLab. The asset URL is keyed by GitLab's internal package_id
  # (not version-templatable) — update both url and sha256 on each bump.
  url: https://gitlab.com/charliecloud/charliecloud/-/package_files/290882913/download
  fn: charliecloud-{{ version }}.tar.gz
  sha256: 2a01ecbb6cb2cfe0495338484fdba1ea63e44a48caff0d77ddd602f9e12177cf

build:
  number: 0
  skip: true  # [not linux]
  script:
    # --enable-buggy-build drops -Werror; needed because v0.44's str.h
    # redefines strncmp (as a poison macro for safety) which collides
    # with glibc's _FORTIFY_SOURCE-provided macro in conda-forge's sysroot.
    - ./configure --prefix=$PREFIX --enable-buggy-build
    - make
    - make install
    # Broken symlink (libexec/charliecloud/fixtures/symlink-to-tmp) that conda's
    # link step rejects with "Is a directory". Removing just the symlink keeps the
    # rest of the test fixtures intact for ch-test.
    - rm -f $PREFIX/libexec/charliecloud/fixtures/symlink-to-tmp

  missing_dso_whitelist:
    - $RPATH/libsotest.so.1

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - make
    - pkg-config

  host:
    - python
    - requests >=2.6.0

  # squashfs-tools / squashfuse are runtime extras for SquashFS image support;
  # bundled here so the package is useful out of the box.
  run:
    - tar
    - python
    - requests >=2.6.0
    - squashfs-tools >=4.2
    - squashfuse >=0.1.100

test:
  commands:
    - ch-run --help
    - ch-run --version
    - ch-image --help
    - ch-image --version
    - ch-convert --help
    - ch-image gestalt

about:
  home: https://charliecloud.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: Lightweight user-defined software stacks for high-performance computing.
  description: Lightweight user-defined software stacks for high-performance computing.
  dev_url: https://gitlab.com/charliecloud/charliecloud
  doc_url: https://charliecloud.io/

extra:
  recipe-maintainers:
    - ngam
