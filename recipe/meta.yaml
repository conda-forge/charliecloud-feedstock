{% set version = "0.44" %}

package:
  name: charliecloud
  version: "{{ version }}"

source:
  # Upstream relocated from github.com/hpc/charliecloud to GitLab in Oct 2024;
  # releases since v0.40 are cut only on GitLab. Using the templatable git
  # archive URL so future bumps need only `version` + `sha256` updates.
  url: https://gitlab.com/charliecloud/charliecloud/-/archive/v{{ version }}/charliecloud-v{{ version }}.tar.gz
  sha256: 1c2504f8a3f03f85d90e51de561da3b56a659af02f6b2fb732bfaf15d6de01a2

build:
  number: 0
  skip: true  # [not linux]
  script:
    # Git archives ship configure.ac only; bootstrap the autotools build.
    - ./autogen.sh
    # --enable-buggy-build drops -Werror so the build survives v0.44's str.h
    # `strncmp` poison-macro vs glibc _FORTIFY_SOURCE `strncmp` macro collision
    # in conda-forge's sysroot. --disable-html/man skip the sphinx-build probe
    # since this package doesn't ship docs.
    - ./configure --prefix=$PREFIX --enable-buggy-build --disable-html --disable-man
    - make -j${CPU_COUNT}
    - make install
    # libexec/charliecloud/fixtures/symlink-to-tmp is a broken symlink that
    # conda's link step rejects with `[Errno 21] Is a directory`. Drop only
    # the broken link; keep the other fixtures usable for ch-test.
    - rm -f $PREFIX/libexec/charliecloud/fixtures/symlink-to-tmp

  # test/sotest/libsotest.so.1 is a test fixture shared library installed
  # under libexec/charliecloud/sotest/ but not linked from anything we ship.
  missing_dso_whitelist:
    - $RPATH/libsotest.so.1

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - make
    # Autotools needed because we build from the git archive (no pre-generated
    # configure). pkg-config is required at autogen.sh time since v0.36
    # (upstream #1845).
    - autoconf
    - automake
    - libtool
    - pkg-config

  host:
    # python is pinned by conda-forge's build matrix; vmin_python=3.6
    # in configure.ac but the matrix only builds against 3.10+ anyway.
    - python
    - requests >=2.6.0

  run:
    - python
    - requests >=2.6.0
    - tar
    # SquashFS image support (vmin_mksquashfs=4.2, vmin_squashfuse=0.1.100).
    - squashfs-tools >=4.2
    - squashfuse >=0.1.100

test:
  commands:
    # Smoke-test the user-facing entry points. ch-image is a Python script,
    # so version-match guards against a silent build-of-wrong-source. ch-run
    # writes --version to stderr (argp default), so don't pipe-grep it.
    # Subcommands like `ch-image gestalt` are not exercised — several lack
    # entry-point registrations in v0.44 and raise NotImplementedError.
    - ch-run --help
    - ch-run --version
    - ch-image --help
    - ch-image --version | grep -Fx {{ version }}
    - ch-convert --help

about:
  home: https://charliecloud.io/
  license: Apache-2.0
  license_file: LICENSE
  summary: Lightweight user-defined software stacks for high-performance computing.
  description: |
    Charliecloud uses Linux user and mount namespaces to run unprivileged
    containers from standard image formats (Docker/OCI) without a daemon or
    setuid root binary, letting HPC users run containerized workloads on
    cluster compute nodes. It includes ch-run (a small C binary launcher),
    ch-image (a Python image manager and builder), and ch-convert (an image
    format converter), targeting environments where rootless Docker/Podman
    aren't viable but unprivileged user namespaces are available.
  dev_url: https://gitlab.com/charliecloud/charliecloud
  doc_url: https://charliecloud.io/

extra:
  recipe-maintainers:
    - ngam
